name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo-regression:
    name: demo-regression (required)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vasooli
          POSTGRES_PASSWORD: vasooli
          POSTGRES_DB: vasooli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://vasooli:vasooli@localhost:5432/vasooli_test
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci
      RAZORPAY_WEBHOOK_SECRET: ci
      GOOGLE_API_KEY: ci
      RESEND_API_KEY: ci
      ADMIN_API_KEY: ci
      EMAIL_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Frozen ledger, API, and policy traces
        working-directory: backend
        run: uv run pytest -q tests/integration/test_demo_golden.py

      - name: Frozen screens and frontend surfaces
        run: node scripts/verify_demo_freeze.mjs

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vasooli
          POSTGRES_PASSWORD: vasooli
          POSTGRES_DB: vasooli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://vasooli:vasooli@localhost:5432/vasooli_test
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci
      RAZORPAY_WEBHOOK_SECRET: ci
      GOOGLE_API_KEY: ci
      RESEND_API_KEY: ci
      ADMIN_API_KEY: ci
      EMAIL_DRY_RUN: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

      - name: Dependency audit (Python)
        # Enforcing. A known vulnerability in a dependency of a payments system is a
        # reason to stop, not a line in a log nobody reads.
        #
        # `--strict` also fails when a package cannot be audited at all, so a silent
        # gap in coverage is treated as a finding rather than a pass.
        run: uv run --with pip-audit pip-audit --strict

      - name: Dependency audit (JavaScript)
        working-directory: frontend
        # High and critical fail the build. Low and moderate findings are reported by
        # `npm audit` locally but do not block: the npm advisory database carries a
        # long tail of low-severity findings in build-time tooling that never reaches
        # production, and failing on those trains people to ignore the check.
        run: npm audit --audit-level=high

      - name: Secret scan
        working-directory: .
        run: |
          # Real credentials must never reach the repo.
          #
          # Test fixtures deliberately carry realistically-SHAPED keys: a stand-in
          # that looks nothing like the real thing exercises none of the parsing it
          # stands in for. They carry the literal marker PLACEHOLDER, which is
          # already load-bearing rather than decorative — app.ai.client
          # ._key_is_configured keys on that exact string (case-sensitively) to
          # decide a key is fake and refuse the call.
          #
          # The allowance requires PLACEHOLDER to sit INSIDE the credential-shaped
          # token, not merely somewhere on the same line. A real key does not stop
          # being a real key because the word appears in a trailing comment.
          found=$(git grep -nE 'rzp_(live|test)_[A-Za-z0-9]{10,}|AIza[A-Za-z0-9_-]{30,}|re_[A-Za-z0-9]{20,}' \
                    -- ':!*.lock' ':!.github/*' \
                  | grep -vE '(rzp_(live|test)_|AIza|re_)[A-Za-z0-9_-]*PLACEHOLDER' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Possible real credential committed"
            exit 1
          fi

  frontend:
    name: frontend-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Placeholders: the build must not require real credentials, and if it ever
        # does, that is a bug worth failing on here rather than at deploy time.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          ADMIN_API_KEY: ci
          SESSION_SECRET: ci-session-secret-long-enough-to-sign-with
          DASHBOARD_PASSWORD: ci-dashboard-password
        run: npm run build
