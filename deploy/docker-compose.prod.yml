# Production stack for a single host. Customer Conversation Safety era.
#
# Five services, one box: Postgres, stateless API, scheduler, worker, and Caddy for
# TLS. Sized for the demo ledger, not for scale — if this ever needs to scale, the
# database moves to RDS first (swap DATABASE_URL, delete the `db` service).
#
# Two things here are load-bearing rather than stylistic:
#
#   * NEITHER `db` NOR `api` publishes a port. Only Caddy is reachable from the
#     internet. A Postgres with 5432 open to 0.0.0.0 is found by scanners within
#     hours, and `vasooli:vasooli` is the first password they try.
#   * The API never starts APScheduler. The dedicated scheduler and worker services
#     own background execution, with Postgres advisory locks preventing duplicates.
#   * Migrations run ONCE, in their own service, as the owning role. The application
#     services then connect as `vasooli_app`, which is NOSUPERUSER/NOBYPASSRLS.
#
#     Both halves of that matter. Every service used to run `alembic upgrade head` in
#     its own start command, so three containers raced the same migration on every
#     deploy. And all three connected as the owning superuser, which bypasses
#     row-level security unconditionally — so the forced RLS policies were inert and
#     the only thing separating tenants was application code. Pointing the app at the
#     owner is not a smaller version of the right configuration; it is a different one,
#     and it is the one where the demo console can read live merchants' ledgers.

name: vasooli

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vasooli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-vasooli}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dumps land here so the backup script can write them from the host.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vasooli} -d ${POSTGRES_DB:-vasooli}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # A demo box has 2GB total. Left uncapped, Postgres will happily plan around
    # memory the app also needs.
    deploy:
      resources:
        limits:
          memory: 640M
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Schema changes, once per deploy, as the role that owns the tables. DDL is not the
  # application's job — and an application role that could ALTER TABLE could switch off
  # the policies that constrain it.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vasooli}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vasooli}
      PROCESS_ROLE: migrate
      SCHEDULER_ENABLED: "false"
    command: ["sh", "-c", "alembic upgrade head"]
    depends_on:
      db:
        condition: service_healthy
    logging: *bounded-logging

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Composed here rather than in .env so the password lives in exactly one place.
      # `vasooli_app`, not the owner: see the header note and scripts/create_app_role.sql.
      DATABASE_URL: postgresql://vasooli_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-vasooli}
      PROCESS_ROLE: api
      SCHEDULER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 900M
    logging: *bounded-logging

  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vasooli_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-vasooli}
      PROCESS_ROLE: scheduler
      SCHEDULER_ENABLED: "true"
    command: ["sh", "-c", "python -m app.scheduler_process"]
    # The image's HEALTHCHECK probes the HTTP port, which only the API serves. This
    # process serves no HTTP, so the inherited check can never pass: the container is
    # "unhealthy" by construction. That is worse than having no check at all, because a
    # genuine failure then looks exactly like the standing noise, and any orchestration
    # keyed on health has nothing to read. Replaced with the liveness that actually
    # matters here — the process can still reach its database.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from sqlalchemy import text; from app.core.db import engine; engine.connect().execute(text('select 1'))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 500M
    logging: *bounded-logging

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vasooli_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-vasooli}
      PROCESS_ROLE: worker
      SCHEDULER_ENABLED: "false"
      WORKER_KIND: all
    command: ["sh", "-c", "python -m app.worker"]
    # The image's HEALTHCHECK probes the HTTP port, which only the API serves. This
    # process serves no HTTP, so the inherited check can never pass: the container is
    # "unhealthy" by construction. That is worse than having no check at all, because a
    # genuine failure then looks exactly like the standing noise, and any orchestration
    # keyed on health has nothing to read. Replaced with the liveness that actually
    # matters here — the process can still reach its database.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from sqlalchemy import text; from app.core.db import engine; engine.connect().execute(text('select 1'))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 700M
    logging: *bounded-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the issued certificates. Losing it means re-requesting them
      # on every restart, and Let's Encrypt rate-limits that to 5 per week per domain.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
