# Production stack with PostgreSQL in a separate AWS RDS failure domain. API,
# scheduler, and worker are independently deployable processes.
# DATABASE_URL must point at an SSL-required RDS endpoint; there is deliberately no
# local database service or database volume in this topology.

name: vasooli

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the private RDS DATABASE_URL in deploy/.env}
      PROCESS_ROLE: api
      SCHEDULER_ENABLED: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 900M
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the private RDS DATABASE_URL in deploy/.env}
      PROCESS_ROLE: scheduler
      SCHEDULER_ENABLED: "true"
    command: ["sh", "-c", "alembic upgrade head && python -m app.scheduler_process"]
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 500M
    logging: *bounded-logging

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the private RDS DATABASE_URL in deploy/.env}
      PROCESS_ROLE: worker
      SCHEDULER_ENABLED: "false"
      WORKER_KIND: all
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700M
    logging: *bounded-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *bounded-logging

volumes:
  caddy_data:
  caddy_config:
